[package]
name = "legalsearch"
version = "1.1.0"
edition = "2021"
description = "LegalSearch local semantic search engine (Chrome Native Messaging host)"
publish = false

[[bin]]
name = "LegalSearch"
path = "src/main.rs"

[lib]
name = "legalsearch"
path = "src/lib.rs"

[dependencies]
# load-dynamic: the official Microsoft CPU-only onnxruntime.dll is loaded from the
# install folder only when the model is first needed (keeps idle RAM tiny).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-27"] }
spm_precompiled = "0.1.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
# Reference implementation, used only by tests/tokenizer_equiv.rs to prove that
# src/tokenizer.rs produces identical token ids.
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
